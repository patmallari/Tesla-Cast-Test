<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Diagnostics — Tesla Cast</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="panel" style="max-width:560px; text-align:left;">
      <h1 style="text-align:center;">Diagnostics</h1>
      <p class="subtitle" style="text-align:center;">Browser and network capability check for this device/browser.</p>

      <table class="diag" id="browserTable">
        <thead><tr><th colspan="2">Browser</th></tr></thead>
        <tbody></tbody>
      </table>
      <table class="diag" id="networkTable" style="margin-top:16px;">
        <thead><tr><th colspan="2">Network</th></tr></thead>
        <tbody></tbody>
      </table>
      <table class="diag" id="serverTable" style="margin-top:16px;">
        <thead><tr><th colspan="2">Server</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="/diagnostics.js"></script>
</body>
</html>
